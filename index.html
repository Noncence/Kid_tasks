<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Задания для ребенка</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFF8E1">
    <meta name="description" content="Семейная система заданий для детей">
</head>
<body>
    <div class="start-page">
        <div class="start-container">
            <div class="logo">
                <div class="logo-icon">⭐</div>
                <h1>Задания</h1>
            </div>
            
            <div class="role-selection">
                <button class="role-btn child-btn" onclick="selectRole('child')">
                    <div class="role-icon">👶</div>
                    <span>Я ребенок</span>
                </button>
                <button class="role-btn parent-btn" onclick="selectRole('parent')">
                    <div class="role-icon">👑</div>
                    <span>Я родитель</span>
                </button>
            </div>
        </div>
    </div>

    <div id="parentLoginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeParentModal()">&times;</span>
            <h3 style="margin-bottom: 20px;">Вход для родителей</h3>
            <input type="password" id="parentPassword" placeholder="Введите пароль" class="input-field">
            <button onclick="loginParent()" class="btn-primary">Войти</button>
            <p class="error-message" id="parentError"></p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="firebase-config.js"></script>
    <script src="firebase-app.js"></script>
    <script src="script.js"></script>
</body>
</html>
